<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex"/>
  <title>Nils Blank · Homepage comparison</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #e9ebf1;
      color: #242633;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      height: 100vh;
      gap: 1px;
      background: #abb0bf;
    }

    section {
      display: flex;
      min-width: 0;
      flex-direction: column;
      background: #f5f6f8;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 52px;
      padding: .7rem 1rem;
      border-bottom: 1px solid #cfd3dc;
      background: rgba(255,255,255,.94);
    }

    h2 {
      margin: 0;
      font-size: .9rem;
      font-weight: 650;
      letter-spacing: .01em;
    }

    a {
      color: #3f4d82;
      font-size: .8rem;
      text-underline-offset: .18em;
    }

    iframe {
      width: 100%;
      flex: 1;
      border: 0;
      background: #fff;
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(2, minmax(600px, 100vh));
        height: auto;
      }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <header>
        <h2>Current site</h2>
        <a href="index.html" target="_blank" rel="noopener">Open full width ↗</a>
      </header>
      <iframe src="index.html" title="Current Nils Blank homepage"></iframe>
    </section>

    <section>
      <header>
        <h2>New candidate · v7.7</h2>
        <a href="index_new.html" target="_blank" rel="noopener">Open full width ↗</a>
      </header>
      <iframe src="index_new.html" title="New Nils Blank homepage candidate"></iframe>
    </section>
  </main>
</body>
</html>
